<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,400i,700">
    <link rel="stylesheet" href="login_signup.css">
    
</head>
<body>
    <div class="box">
        <div class="icon"><i class="fas fa-user-alt"></i></div>
        <form id="login" >
            <h1>Login</h1>
            <h2>E-mail</h2>
            <input class="mail" type="email" id="login-email" />
            <h2>Password</h2>
            <div class="input-box">
                <i class="far fa-eye eye-btn" id="login-eye"></i>
                <input class="password" type="password" id="login-password" />
            </div>
            <button type="submit" value="Login">Login</button>
            <div id="login-message" class="mt-3 text-center" ></div>
            <span class="grey forgot"><a href="#">Forgot your password?</a></span>
            <span class="grey signup">Don't have an account? <a href="#" class="signup-btn">Sign up</a></span>
        </form>
        <form id="signup">
            <h1>Sign Up</h1>
            <h2>Name</h2>
            <div class="input-box">
                <input class="name" type="text" id="signup-name"/>
            </div>
            <h2>Email</h2>
            <div class="input-box">
                <input class="e-mail" type="text" id="signup-email" placeholder="example@mail.com" />
            </div>
            <h2>Bio</h2>
            <div class="input-box">
                <textarea class="bio" id="signup-bio" placeholder="Tell us about yourself" ></textarea>
            </div>
            
            <h2>Password</h2>
            <div class="passwords-box">
                <div class="input-box">
                    <i class="far fa-eye eye-btn" id="signup-eye"></i>
                    <input class="password" type="password" id="signup-password" />
                </div>
            </div>
            <h2>Profile Image</h2>
            <div class="input-box">
                <label class="custom-file-upload">
                    <i class="fa fa-upload" aria-hidden="true"></i>
                    Upload Image
                    <input class="image" type="file" id="signup-image" accept="image/*" />
                </label>
            </div>
            <button type="submit" value="Sign Up">Sign Up</button>
            <div id="signup-message" class="mt-3 text-center"></div>
            <span class="grey login">Already signed up? <a href="#" class="login-btn">Log in</a></span>
        </form>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const token = localStorage.getItem('authToken');
                if (token) {
                    window.location.href = 'index.html';
                }
            });
        </script>
    </div>
    <script src="./login_signup.js"></script>
</body>
</html>
