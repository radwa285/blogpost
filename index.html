<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">

                        <li class="nav-item">

                            <a class="nav-link" href="#" style="color: black;font-size: 12px; font-weight: bold;">NFL</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color: black;font-size: 12px; font-weight: bold;">NHL</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color: black;font-size: 12px; font-weight: bold;">MLB</a>

                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color: black; font-size: 12px; font-weight: bold;">FANTASY</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color: black; font-size: 12px; font-weight: bold;">NASCAR</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color: black;">
                                <i class="fa fa-search" aria-hidden="true" style="margin-right: 0px;"></i>
                            </a>  
                        </li>
                        <button class="btn" id="user_img" style="background-color:rgb(103, 192, 103); border-radius: 30px; font-size: 12px; font-weight: bold; color: white; height: 35px; margin-left: 80px;">
                       
                        </button>

                </div>
            </div>
        </nav>
       

        <div class="image-container">
            <img src="./Team branding.png" alt="NHL Image" class="img-fluid">
            <div class="overlay">
                <div class="text-container">
                </div>
            </div>
        </div>
        <div id="posts-container" class="mt-4">
          <div  class=".post-card">
            
          </div>
          <div id="user-info" class="mt-4">
        </div>
    </div>
    <div class="footer1">
      <img src="./Group 1161.png" class="img-fluid">
  </div>
  <div class="footer2">
      <img src="./Footer.png" class="img-fluid">
  </div>
  <div class="row row-cols-1 row-cols-md-3 g-4" id="posts-container">
   
</div>

  </div>

   
    <div>
        <form class="profile">
            <button class="btn-form"><div class="prof">Profile Menu</div>
                <i class="fa fa-times" aria-hidden="true" style="margin-left: 160px;"></i>
            </button>
         <div style="background-color: #F6F7F9; width: 100%; height: 100px;"> </div>
         <div>
            <span ><i class="fa fa-pencil-square-o" aria-hidden="true" ></i></span>

              <span class="account" >account settings</span> 
            </div>
            <div class="log" id="logoutBtn">
              <span class="sign">
                  <img class="Sign" src="./arrow.png" style="width: 20px; height: 20px;">
              </span>
              <span class="text1">logout</span>
          </div>
          
         </div>
