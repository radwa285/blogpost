<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Posts</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
         
        }
        #posts-container {
            margin-top: -30px;
            
        }
        .post-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            height: 100%;
            margin-top: 20px;
            margin-bottom: 20px; 
            /* background-color:#f0f0f0; */
        }
        .post-card img {
            width: 100%;
            height: 120px;
            border-radius: 5px;
        }
        .post-card .post-content {
            flex: 1;
            margin-bottom: 10px;
        }
        .post-card .tag {
            margin-bottom: 10px;
        }
        .post-card .buttons {
            margin-top: auto;
            display: flex;
        }
        .edit {
            margin-left: 20px;
            background-color: #53AA51;
            color: #fff;
        }
        .modal {
            text-align: center;
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modalContent {
            font-size: 20px;
            font-weight: bold;
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            border-radius: 10px;
        }
        .close {
            color: rgb(255, 65, 65);
            float: right;
            font-size: 40px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: #ff1010;
            cursor: pointer;
        }
        .modalContent button {
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
        }
        .del {
            background-color: rgb(255, 65, 65);
            color: white;
        }
        .cancel {
            background-color: #53AA51;
            color: white;
        }

    </style>
</head>
<body>
    <div style="background-color:#f0f0f0; height: 50px; border-bottom: 1px solid gray;" >
        <img src="logoblack.jpg" style="margin-left: 150px; margin-top: 15px;">
    </div>
    <div class="container mt-4">
        <div id="posts-container" class="row">
            <div class="col-md-4"> 
                <div class="post-card">
                   
                    </div>
                    
                </div>
            </div>
        </div>
   
    <div class="modal" id="confirm-delete-modal">
        <div class="modalContent">
            <span class="close">&times;</span>
            <p>Are you sure you want to delete this post?</p>
            <button class="del" id="confirm-delete">Delete</button>
            <button class="cancel" onclick="hideModal()">Cancel</button>
        </div>
    </div>

   
    <div class="modal" id="edit-post-modal">
        <div class="modalContent">
            <span class="close" onclick="hideEditModal()">&times;</span>
            <form id="edit-post-form">
                <input type="hidden" id="edit-post-id">
                <div class="form-group">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" class="form-control">
                </div>
                <div class="form-group">
                    <label for="edit-content"></label>
                    <textarea id="edit-content" class="form-control" rows="5"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-image">Image </label>
                    <input type="text" id="edit-image" class="form-control">
                </div>
                <button type="button" class="btn cancel" onclick="submitEditPost()">Save Changes</button>
                <button type="button" class="btn del" onclick="hideEditModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script src="./userPost.js"></script>
</body>
</html>
